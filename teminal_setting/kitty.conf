# Shell の指定
shell /bin/bash

# フォントの指定
# font_family      Jetbrains Mono
# font_family FiraCode Nerd Font Mono
# font_size        11.0

# タブのデザイン
tab_bar_style powerline
inactive_tab_font_style normal
active_tab_font_style   bold-italic

# Tab ショートカットKey
map ctrl+shift+n next_tab
map ctrl+shift+p previous_tab

# ターミナル背景画像
background_image ~/Pictures/Neuschwanstein_Castle_night1920x1200.jpg
background_image_layout centered
background_tint 0.6
#---background_image_layout option 6.---
# 1) tiled — 画像をタイル状に繰り返す
# 2) mirror-tiled — タイル状に並べ、隣り合う画像を反転する
# 3) scaled — ウィンドウ全体に合わせて拡大・縮小する（縦横比は維持しない）
# 4) cscaled — 縦横比を保ってウィンドウに合わせる
# 5) clamped — 画像を拡大・縮小せず、端をウィンドウ内に収める
# 6) centered — 画像を中央に配置する
#---background_tint 0.x は背景色で画像に tint をかけて文字を読みやする---

# Window size
remember_window_size no
initial_window_width 96c
initial_window_height 54c
background_opacity 0.9

# WindowManager
focus_on_window_activation yes
linux_display_server x11

#警告音のoff
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab no

# Dracula theme --- download from dracula
include dracula.conf

# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# END_KITTY_FONTS